                const vol = Math.max(0, Math.min(1, mediaVolume));
                if (mediaType === 'yt' && ytPlayer && typeof ytPlayer.setVolume === 'function') {
                    try { ytPlayer.setVolume(Math.round(vol * 100)); } catch (e) {}
                } else if (mediaType === 'video') {
                    localVideo.volume = vol;
                } else if (mediaType === 'audio') {
                    localAudio.volume = vol;
                }
            }

            function applyMediaSpeed() {
                const rate = Math.max(0.2, Math.min(3, mediaSpeed));
                if (mediaType === 'yt' && ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') {
                    try { ytPlayer.setPlaybackRate(rate); } catch (e) {}
                } else if (mediaType === 'video') {
                    localVideo.playbackRate = rate;
                } else if (mediaType === 'audio') {
                    localAudio.playbackRate = rate;
                }
            }

            if (mediaVolumeInput) {
                mediaVolumeInput.addEventListener('input', (e) => {
                    mediaVolume = parseFloat(e.target.value);
                    mediaVolumeValSpan.textContent = mediaVolume.toFixed(2);
                    applyMediaVolume();
                });
                mediaVolumeInput.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    let val = parseFloat(mediaVolumeInput.value) + (e.deltaY < 0 ? 0.05 : -0.05);
                    val = Math.max(0, Math.min(1, val));
                    mediaVolumeInput.value = val.toFixed(2);
                    mediaVolume = val;
                    mediaVolumeValSpan.textContent = val.toFixed(2);
                    applyMediaVolume();
                }, { passive: false });
            }

            if (mediaSpeedInput) {
                mediaSpeedInput.addEventListener('input', (e) => {
                    mediaSpeed = parseFloat(e.target.value);
                    mediaSpeedValSpan.textContent = mediaSpeed.toFixed(2) + 'x';
                    applyMediaSpeed();
                });
                mediaSpeedInput.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    let val = parseFloat(mediaSpeedInput.value) + (e.deltaY < 0 ? 0.05 : -0.05);
                    val = Math.max(0.2, Math.min(3, Math.round(val * 20) / 20)); // snap to 0.05
                    mediaSpeedInput.value = val.toFixed(2);
                    mediaSpeed = val;
                    mediaSpeedValSpan.textContent = val.toFixed(2) + 'x';
                    applyMediaSpeed();
                }, { passive: false });
            }

            let isDraggingNewTop = false;
            let isDraggingNewBottom = false;
            let isResizingTag = false;
            let isScrubbing = false;
            let activeTagId = null;
            let resizeHandle = null;
            let startX = 0;
            let currentX = 0;
            let tags = []; 
            let bottomTagPercent = null;

            let watchHistory = JSON.parse(localStorage.getItem('yt_clean_history') || '[]');

            renderHistory();
            startProgressLoop();

            function hideAllPlayers() {
                placeholderUi.classList.add('hidden');
                iframeWrapper.classList.add('hidden');
                localVideoWrapper.classList.add('hidden');
                localAudioWrapper.classList.add('hidden');

                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                localVideo.pause();
                localVideo.src = '';
                localAudio.pause();
                localAudio.src = '';
                
                isPlaying = false;
                updatePlayPauseIcon();
            }

            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function getMediaTimes() {
                let current = 0;
                let duration = 0;

                if (mediaType === 'yt' && ytPlayer && ytPlayer.getCurrentTime) {
                    current = ytPlayer.getCurrentTime() || 0;
                    duration = ytPlayer.getDuration() || 0;
                } else if (mediaType === 'video') {
                    current = localVideo.currentTime || 0;
                    duration = localVideo.duration || 0;
                } else if (mediaType === 'audio') {
                    current = localAudio.currentTime || 0;
                    duration = localAudio.duration || 0;
                }

                return { current, duration };
            }

            function seekToTime(seconds) {
                if (mediaType === 'yt' && ytPlayer && ytPlayer.seekTo) {
                    ytPlayer.seekTo(seconds, true);
                } else if (mediaType === 'video') {
                    localVideo.currentTime = seconds;
                } else if (mediaType === 'audio') {
                    localAudio.currentTime = seconds;
                }
                updatePlayhead();
            }

            function updatePlayhead() {
                const { current, duration } = getMediaTimes();
                timeCurrent.textContent = formatTime(current);
                timeDuration.textContent = formatTime(duration);

                if (duration > 0 && !isScrubbing) {
                    const pct = Math.min(100, Math.max(0, (current / duration) * 100));
                    playheadProgress.style.width = `${pct}%`;
                    playheadLine.style.left = `${pct}%`;

                    if (isLooping && tags.length > 0) {
                        const tag = tags[0];
                        const startSec = (tag.startPercent / 100) * duration;
                        const endSec = (tag.endPercent / 100) * duration;

                        if (current >= endSec) {
                            seekToTime(startSec);
                        }
                    }
                }
            }

            function startProgressLoop() {
                if (progressTimer) clearInterval(progressTimer);
                progressTimer = setInterval(() => {
                    updatePlayhead();
                }, 250);
            }

            function updatePlayPauseIcon() {
                if (isPlaying) {
                    iconPlayPause.className = 'fa-solid fa-pause text-sm';
                    btnPlayPause.title = '暫停';
                } else {
                    iconPlayPause.className = 'fa-solid fa-play text-sm';
                    btnPlayPause.title = '播放';
                }
            }

            function togglePlayPause() {
                if (!mediaType) return;

                if (isPlaying) {
                    pauseMedia();
                } else {
                    playMedia();
                }
            }

            function playMedia() {
                if (!mediaType) return;
                applyMediaVolume();
                applyMediaSpeed();
                if (mediaType === 'yt' && ytPlayer && ytPlayer.playVideo) {
                    ytPlayer.playVideo();
                } else if (mediaType === 'video') {
                    localVideo.play();
                } else if (mediaType === 'audio') {
                    localAudio.play();
                }
                isPlaying = true;
                updatePlayPauseIcon();
            }

            function pauseMedia() {
                if (mediaType === 'yt' && ytPlayer && ytPlayer.pauseVideo) {
                    ytPlayer.pauseVideo();
                } else if (mediaType === 'video') {
                    localVideo.pause();
                } else if (mediaType === 'audio') {
                    localAudio.pause();
                }
                isPlaying = false;
                updatePlayPauseIcon();
            }

            function stopMedia() {
                if (!mediaType) return;

                const { duration } = getMediaTimes();
                let targetTimeSec = 0;
                let targetLabelText = '00:00';

                if (isLooping && tags.length > 0 && duration > 0) {
                    targetTimeSec = (tags[0].startPercent / 100) * duration;
                    targetLabelText = 'Loop 起始點';
                } else if (!isLooping && bottomTagPercent !== null && duration > 0) {
                    targetTimeSec = (bottomTagPercent / 100) * duration;
                    targetLabelText = '下半部定位標籤';
                }

                if (isPlaying) {
                    pauseMedia();
                    seekToTime(targetTimeSec);
                    showToast(`已停止並返回至 ${targetLabelText}`, 'info');
                } else {
                    seekToTime(targetTimeSec);
                    playMedia();
                    showToast(`從 ${targetLabelText} 開始播放`, 'info');
                }
            }

            btnPlayPause.addEventListener('click', togglePlayPause);
            btnStop.addEventListener('click', stopMedia);

            btnLoop.addEventListener('click', () => {
                isLooping = !isLooping;
                if (isLooping) {
                    btnLoop.className = 'w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center transition shadow-md shadow-indigo-600/20';
                    btnLoop.title = '循環模式已開啟 (Loop ON)';
                    showToast('已開啟 Loop 循環模式', 'info');
                } else {
                    btnLoop.className = 'w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center transition border border-slate-700';
                    btnLoop.title = '循環模式已關閉 (Loop OFF)';
                    showToast('已關閉 Loop 循環模式', 'info');
                }

                if (tags.length === 0) {
                    localVideo.loop = isLooping;
                    localAudio.loop = isLooping;
                }
            });

            // Input handlers & YouTube URL extraction
            urlInput.addEventListener('input', () => {
                if (urlInput.value.trim().length > 0) {
                    clearInputBtn.classList.remove('hidden');
                } else {
                    clearInputBtn.classList.add('hidden');
                }
            });

            clearInputBtn.addEventListener('click', () => {
                urlInput.value = '';
                clearInputBtn.classList.add('hidden');
                urlInput.focus();
            });

            function extractYouTubeId(url) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
            }

            urlForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const videoId = extractYouTubeId(urlInput.value.trim());
                if (videoId) {
                    loadYouTubeVideo(videoId);
                } else {
                    showToast('請輸入有效的 YouTube 網址或影片 ID', 'error');
                }
            });

            function loadYouTubeVideo(videoId) {
                hideAllPlayers();
                mediaType = 'yt';
                iframeWrapper.classList.remove('hidden');

                if (!ytPlayer) {
                    ytPlayer = new YT.Player('yt-player-target', {
                        height: '100%',
                        width: '100%',
                        videoId: videoId,
                        playerVars: {
                            'autoplay': 1,
                            'controls': 1,
                            'modestbranding': 1,
                            'rel': 0
                        },
                        events: {
                            'onReady': function(event) {
                                applyMediaVolume();
                                applyMediaSpeed();
                            },
                            'onStateChange': onYtPlayerStateChange
                        }
                    });
                } else {
                    ytPlayer.loadVideoById(videoId);
                    // Apply volume & speed shortly after load in case player is already ready
                    setTimeout(() => {
                        applyMediaVolume();
                        applyMediaSpeed();
                    }, 300);
                }

                addToHistory(videoId, `YouTube 影片 (${videoId})`, 'yt');
                showToast('YouTube 影片已成功載入', 'success');
            }

            function onYtPlayerStateChange(event) {
                if (event.data === YT.PlayerState.PLAYING) {
                    isPlaying = true;
                    updatePlayPauseIcon();
                    applyMediaVolume();
                    applyMediaSpeed();
                } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                    isPlaying = false;
                    updatePlayPauseIcon();
                }
            }

            // Local File Handler
            localFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                hideAllPlayers();
                const fileUrl = URL.createObjectURL(file);
                const isAudio = file.type.startsWith('audio');

                if (isAudio) {
                    mediaType = 'audio';
                    localAudioWrapper.classList.remove('hidden');
                    localAudio.src = fileUrl;
                    audioFileName.textContent = file.name;
                    localAudio.volume = mediaVolume;
                    localAudio.playbackRate = mediaSpeed;
                    localAudio.play();
                } else {
                    mediaType = 'video';
                    localVideoWrapper.classList.remove('hidden');
                    localVideo.src = fileUrl;
                    localVideo.volume = mediaVolume;
                    localVideo.playbackRate = mediaSpeed;
                    localVideo.play();
                }

                isPlaying = true;
                updatePlayPauseIcon();
                applyMediaVolume();
                applyMediaSpeed();
                addToHistory(file.name, file.name, isAudio ? 'audio' : 'video');
                showToast(`已成功載入本地檔案: ${file.name}`, 'success');
            });

            // Watch History State
            function addToHistory(id, title, type) {
                watchHistory = watchHistory.filter(item => item.id !== id);
                watchHistory.unshift({ id, title, type, timestamp: Date.now() });
                if (watchHistory.length > 20) watchHistory.pop();
                localStorage.setItem('yt_clean_history', JSON.stringify(watchHistory));
                renderHistory();
            }

            function renderHistory() {
                historyList.innerHTML = '';
                if (watchHistory.length === 0) {
                    emptyHistory.classList.remove('hidden');
                    return;
                }
                emptyHistory.classList.add('hidden');

                watchHistory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 cursor-pointer transition border border-slate-700/50 flex items-center justify-between text-xs group';
                    
                    let iconClass = 'fa-youtube text-red-500';
                    if (item.type === 'video') iconClass = 'fa-file-video text-blue-400';
                    if (item.type === 'audio') iconClass = 'fa-file-audio text-emerald-400';

                    div.innerHTML = `
                        <div class="flex items-center space-x-2 truncate">
                            <i class="fa-brands ${iconClass} text-sm"></i>
                            <span class="truncate text-slate-300 group-hover:text-white font-medium">${item.title}</span>
                        </div>
                        <i class="fa-solid fa-play text-[10px] text-slate-500 group-hover:text-indigo-400 opacity-0 group-hover:opacity-100 transition"></i>
                    `;

                    div.addEventListener('click', () => {
                        if (item.type === 'yt') {
                            loadYouTubeVideo(item.id);
                        } else {
                            showToast('本地檔案請透過選擇「本地」檔案按鈕開啟', 'info');
                        }
                    });

                    historyList.appendChild(div);
                });
            }

            clearHistoryBtn.addEventListener('click', () => {
                watchHistory = [];
                localStorage.removeItem('yt_clean_history');
                renderHistory();
                showToast('觀看紀錄已全數清除', 'info');
            });

            // Toast Helper
            function showToast(msg, type = 'info') {
                toastText.textContent = msg;
                toastMessage.classList.remove('hidden');

                if (type === 'success') {
                    toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
                } else if (type === 'error') {
                    toastIcon.className = 'fa-solid fa-circle-xmark text-red-400';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-info text-indigo-400';
                }

                setTimeout(() => {
                    toastMessage.classList.add('hidden');
                }, 3000);
            }

            // --- Timeline Drag & Custom Tag Logic ---
            function getPercentFromX(clientX) {
                const rect = timelineBox.getBoundingClientRect();
                const x = clientX - rect.left;
                return Math.min(100, Math.max(0, (x / rect.width) * 100));
            }

            function renderTags() {
                tagsLayer.innerHTML = '';
                bottomTagsLayer.innerHTML = '';

                tagCountEl.textContent = tags.length + (bottomTagPercent !== null ? 1 : 0);

                tags.forEach(tag => {
                    const tagEl = document.createElement('div');
                    tagEl.className = 'tag-region';
                    tagEl.style.left = `${tag.startPercent}%`;
                    tagEl.style.width = `${tag.endPercent - tag.startPercent}%`;

                    const handleL = document.createElement('div');
                    handleL.className = 'tag-handle tag-handle-left';
                    handleL.addEventListener('mousedown', (e) => startResize(e, tag.id, 'left'));

                    const handleR = document.createElement('div');
                    handleR.className = 'tag-handle tag-handle-right';
                    handleR.addEventListener('mousedown', (e) => startResize(e, tag.id, 'right'));

                    const delBtn = document.createElement('div');
                    delBtn.className = 'tag-delete-btn';
                    delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTag(tag.id);
                    });

                    tagEl.appendChild(handleL);
                    tagEl.appendChild(handleR);
                    tagEl.appendChild(delBtn);

                    tagEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const { duration } = getMediaTimes();
                        if (duration > 0) {
                            seekToTime((tag.startPercent / 100) * duration);
                        }
                    });

                    tagsLayer.appendChild(tagEl);
                });

                if (bottomTagPercent !== null) {
                    const bTagEl = document.createElement('div');
                    bTagEl.className = 'bottom-tag-region';
                    bTagEl.style.left = `${bottomTagPercent}%`;

                    bTagEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const { duration } = getMediaTimes();
                        if (duration > 0) {
                            seekToTime((bottomTagPercent / 100) * duration);
                        }
                    });

                    bottomTagsLayer.appendChild(bTagEl);
                }
            }

            function deleteTag(id) {
                tags = tags.filter(t => t.id !== id);
                renderTags();
                showToast('已刪除區段標籤', 'info');
            }

            function clearAllTags() {
                tags = [];
                bottomTagPercent = null;
                renderTags();
                showToast('所有標籤已清除', 'info');
            }

            clearTagsBtn.addEventListener('click', clearAllTags);

            function startResize(e, tagId, handle) {
                e.stopPropagation();
                isResizingTag = true;
                activeTagId = tagId;
                resizeHandle = handle;
            }

            // Mouse interactions on timeline
            timelineBox.addEventListener('mousemove', (e) => {
                const pct = getPercentFromX(e.clientX);
                const { duration } = getMediaTimes();

                if (duration > 0) {
                    timelineTooltip.style.display = 'block';
                    timelineTooltip.style.left = `${pct}%`;
                    timelineTooltip.textContent = formatTime((pct / 100) * duration);
                }

                if (isScrubbing) {
                    playheadLine.style.left = `${pct}%`;
                    playheadProgress.style.width = `${pct}%`;
                    if (duration > 0) seekToTime((pct / 100) * duration);
                    return;
                }

                if (isDraggingNewTop) {
                    currentX = pct;
                    const start = Math.min(startX, currentX);
                    const width = Math.abs(currentX - startX);
                    tagPreview.style.left = `${start}%`;
                    tagPreview.style.width = `${width}%`;
                    tagPreview.style.display = 'block';
                    return;
                }

                if (isDraggingNewBottom) {
                    currentX = pct;
                    bottomTagPreview.style.left = `${currentX}%`;
                    bottomTagPreview.style.display = 'block';
                    return;
                }

                if (isResizingTag) {
                    const tag = tags.find(t => t.id === activeTagId);
                    if (tag) {
                        if (resizeHandle === 'left') {
                            tag.startPercent = Math.min(pct, tag.endPercent - 1);
                        } else {
                            tag.endPercent = Math.max(pct, tag.startPercent + 1);
                        }
                        renderTags();
                    }
                }
            });

            timelineBox.addEventListener('mouseleave', () => {
                timelineTooltip.style.display = 'none';
            });

            topHalf.addEventListener('mousedown', (e) => {
                if (isResizingTag) return;
                isDraggingNewTop = true;
                startX = getPercentFromX(e.clientX);
            });

            bottomHalf.addEventListener('mousedown', (e) => {
                isDraggingNewBottom = true;
                startX = getPercentFromX(e.clientX);
            });

            playheadLine.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isScrubbing = true;
            });

            document.addEventListener('mouseup', (e) => {
                if (isScrubbing) {
                    isScrubbing = false;
                }

                if (isDraggingNewTop) {
                    isDraggingNewTop = false;
                    tagPreview.style.display = 'none';
                    const endX = getPercentFromX(e.clientX);
                    const startPercent = Math.min(startX, endX);
                    const endPercent = Math.max(startX, endX);

                    if (endPercent - startPercent > 0.5) {
                        tags.push({
                            id: Date.now(),
                            startPercent,
                            endPercent
                        });
                        renderTags();
                        showToast('已新增區段標籤', 'success');
                    }
                }

                if (isDraggingNewBottom) {
                    isDraggingNewBottom = false;
                    bottomTagPreview.style.display = 'none';
                    bottomTagPercent = getPercentFromX(e.clientX);
                    renderTags();
                    showToast('已更新定位標籤', 'success');
                }

                if (isResizingTag) {
                    isResizingTag = false;
                    activeTagId = null;
                    resizeHandle = null;
                }
            });
        });

        // Window load initialization
        window.onload = function() {
            rebuildKeyboardMapping();
            renderModeButtons();
            renderChordButtons();
            renderPianoKeyboard();
            setTimeout(() => {
                const targetScroll = 1350;
                pianoScroll.scrollLeft = targetScroll;
                topScroll.scrollLeft = targetScroll;
            }, 100);
        };
    </script>
</body>
</html>
